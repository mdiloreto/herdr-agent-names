name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check main.js
          node --check helpers.js
          node --check settings.js
          node --check namer.js
          node --check cleanup.js
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Python syntax check
        run: python3 -m py_compile plugins/herdr-agy-titles/herdr-agy-title.py
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
